<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Búsqueda de películas</title>
</head>
<body>

<div class="container">

    <h1>Búsqueda de películas</h1>

    <form th:action="@{/findMovies}" method="post">
        Título de la película:
        <input type="text" name="titulo" />
        <br><br>
        Nombre género:
        <input type="text" name="genero" />
        <br><br>
        <input type="submit" value="Buscar" />
    </form>
    <table >
        <tr>
            <th>Código</th>
            <th>titulo</th>
            <th>Género</th>
            <th>¿Subtitulada?</th>
            <th>Índice</th>
        </tr>
        <tr th:each="pelicula: ${peliculas}">
            <td><span th:text="${pelicula.peliculaId}"></span></td>
            <td><span th:text="${pelicula.titulo}"></span></td>
            <td><span th:text="${pelicula.genero.nombreGenero}"></span></td>
            <td><span th:text="${pelicula.subtitulada}"></span></td>
            <td><span th:text="${peliculaStat.count}"></span></td>
        </tr>
    </table>
</div>
</body>
</html>
